[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akos"
version = "0.1.0"
description = "Agent-Native Knowledge Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langsmith>=0.1.0",
  "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "black>=24.8.0"]
neo4j = ["neo4j>=5.0.0"]
embedding = ["sentence-transformers>=3.0.0", "modelscope>=1.11.0"]
docs = [
  "python-docx>=1.1.0",
  "pymupdf>=1.24.0",
  "rapidocr-onnxruntime>=1.2.3",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "akos*",
  "agents*",
  "infra*",
  "knowledge*",
  "ontology*",
  "verification*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "no_llm_stub: 禁用全局 LLM 挡板，用于测试 OpenAiCompatibleClient 本身",
    "llm_integration: 允许真实 LLM 集成测试（需显式设置 AKOS_LLM_API_KEY）",
]

[tool.black]
line-length = 120
