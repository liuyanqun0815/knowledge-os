# Development overlay: expose service ports and mount source for hot reload.
#
# Usage (from deploy/):
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  postgres:
    ports:
      - "5432:5432"

  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  akos-api:
    volumes:
      - ..:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      AKOS_NEO4J_URI: bolt://neo4j:7687
